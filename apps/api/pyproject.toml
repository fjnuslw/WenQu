[project]
name = "get-offer-api"
version = "0.1.0"
description = "get_offer 知识工程与检索服务（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "mistune>=3.0",
    "selectolax>=0.3.21",
    "pypdf>=5.0",
    "pgvector>=0.3.6",
    "tree-sitter-language-pack>=1.15.8,<2",
    "meilisearch>=0.33",
    "arq>=0.26",
    "python-multipart>=0.0.20",
    "genanki>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getoffer"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
